name: Automated Linting

on:
  push:
  pull_request:


jobs:
  lint:
    runs-on: ubuntu-latest


    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

        
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
      
      - name: Lint HTML
        run: npx htmlhint index.html color.html
   
      - name: Lint CSS
        run: npx stylelint "css/**/*.css"
      
      - name: Lint JavaScript
        run: npx eslint index.html color.html
